name: docs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system hatch 'click < 8.3.0'

      - name: Check documentation
        run: hatch run docs:build-check

  publish:
    name: Publish documentation
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write # mike deploy pushes to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # mike deploy pushes to the gh-pages branch
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Configure Git for GitHub Actions bot
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Deploy documentation (dev) with mike 🚀
        if:
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'scipp-atlas/mapyde'
        run: hatch run docs:deploy dev

      - name: Get MAJOR.MINOR version
        if: github.event_name == 'release' && github.event.action == 'published'
        id: label
        run: |
          VERSION=$(cut -d '.' -f 1,2 <<< "${GITHUB_EVENT_RELEASE_TAG_NAME}")
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name:
          Deploy documentation (${{ steps.label.outputs.version }}) with mike 🚀
        if: github.event_name == 'release' && github.event.action == 'published'
        run:
          hatch run docs:deploy ${STEPS_LABEL_OUTPUTS_VERSION} latest
        env:
          STEPS_LABEL_OUTPUTS_VERSION: ${{ steps.label.outputs.version }}
